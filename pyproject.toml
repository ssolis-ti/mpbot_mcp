[project]
name = "mpbot-mcp"
version = "0.1.0"
description = "Conector oficial de mpbot para agentes de IA (Claude Code, Claude Desktop, Hermes, OpenClaw)"
readme = "docs/README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.27",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
mpbot-mcp = "mpbot_mcp.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mpbot_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
