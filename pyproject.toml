[project]
name = "mpbot-mcp"
version = "0.1.0"
description = "Conecta cualquier asistente de IA compatible con MCP a los datos de Compra Ágil de mpbot."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.27,<2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://mpbot.cl"
App = "https://app.mpbot.cl"
Repository = "https://github.com/ssolis-ti/mpbot_mcp"

[project.scripts]
mpbot-mcp = "mpbot_mcp.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-anyio",
    "anyio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mpbot_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
